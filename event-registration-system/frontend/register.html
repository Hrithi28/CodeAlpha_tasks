<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">EventConnect</a>
            <ul id="nav-links"></ul>
        </nav>
    </header>
    
    <main>
        <div class="form-container">
            <h2>Create an Account</h2>
            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>
            
            <form id="register-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            
            <div class="link-text">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            
            if(getAuthToken()) {
                window.location.href = 'dashboard.html';
            }
            
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.textContent = 'Creating account...';
                btn.disabled = true;
                
                const user = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const pass = document.getElementById('password').value;
                const errorDiv = document.getElementById('error-msg');
                const successDiv = document.getElementById('success-msg');
                
                try {
                    const res = await apiFetch('/auth/register/', {
                        method: 'POST',
                        body: JSON.stringify({username: user, email: email, password: pass})
                    });
                    
                    if(res.ok) {
                        errorDiv.textContent = '';
                        successDiv.textContent = 'Account created! Redirecting to login...';
                        setTimeout(() => window.location.href = 'login.html', 2000);
                    } else {
                        const data = await res.json();
                        errorDiv.textContent = Object.values(data)[0] || 'Registration failed';
                        btn.textContent = 'Sign Up';
                        btn.disabled = false;
                    }
                } catch(e) {
                    errorDiv.textContent = 'Connection error. Try again.';
                    btn.textContent = 'Sign Up';
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
