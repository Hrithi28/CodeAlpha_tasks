<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventConnect - Discover Premium Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">EventConnect</a>
            <ul id="nav-links">
                <!-- Dynamically populated -->
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h1>Discover Exceptional Events</h1>
            <p>Join exclusive gatherings, workshops, and experiences curated just for you.</p>
        </section>
        
        <div id="events-list" class="grid">
            <!-- Loading state -->
            <div style="text-align:center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted);">
                Loading events...
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            
            fetchEvents().then(events => {
                const container = document.getElementById('events-list');
                container.innerHTML = '';
                
                if(!events || events.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h3>No upcoming events</h3>
                            <p>Check back soon for new experiences.</p>
                        </div>`;
                    return;
                }
                
                events.forEach(event => {
                    const date = new Date(event.date).toLocaleDateString(undefined, {
                        weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    
                    const el = document.createElement('a');
                    el.href = `event.html?id=${event.id}`;
                    el.className = 'card';
                    el.innerHTML = `
                        <span class="badge">${event.location}</span>
                        <h3>${event.title}</h3>
                        <p style="color:var(--primary-light); font-weight:500; font-size:0.9rem; margin-bottom:1rem;">📅 ${date}</p>
                        <p>${event.description.substring(0, 100)}${event.description.length > 100 ? '...' : ''}</p>
                    `;
                    container.appendChild(el);
                });
            }).catch(e => {
                document.getElementById('events-list').innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1; border-color:var(--danger)">
                    <h3 style="color:var(--danger)">Failed to load events</h3>
                    <p>Make sure the backend server is running.</p>
                </div>`;
            });
        });
    </script>
</body>
</html>
